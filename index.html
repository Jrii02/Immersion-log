<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <title>Immersion Proof Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; max-width: 480px; margin: auto; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; text-align: center; color: #818cf8; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #1e293b; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 0.9rem; }
    button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:active { background: #4f46e5; }
    .log-item { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #6366f1; display: flex; justify-content: space-between; align-items: center; }
    .log-meta { font-size: 0.75rem; color: #94a3b8; }
    .del-btn { background: transparent; color: #ef4444; border: none; width: auto; padding: 4px 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <h1>⚡ Immersion Proof Log</h1>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalTime">0 Jam</div>
      <div class="stat-label">Total Listening / Reading</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalCards">0</div>
      <div class="stat-label">Total Kata/Kartu Tambahan</div>
    </div>
  </div>

  <div class="card">
    <form id="logForm">
      <label>Kategori</label>
      <select id="type">
        <option value="Anime / Series">Anime / Series</option>
        <option value="Manga / Novel">Manga / Novel</option>
        <option value="YouTube / Podcast">YouTube / Podcast</option>
        <option value="Sentence Mining">Sentence Mining (Anki)</option>
      </select>

      <label>Durasi (Menit)</label>
      <input type="number" id="minutes" placeholder="Contoh: 25" min="0" required />

      <label>Kata Baru Ditangkap (Opsional)</label>
      <input type="number" id="cards" placeholder="Contoh: 5" min="0" value="0" />

      <label>Catatan / Judul</label>
      <input type="text" id="note" placeholder="Misal: Jujutsu Kaisen Ep 3" required />

      <button type="submit">+ Simpan Bukti</button>
    </form>
  </div>

  <div id="logList"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let logs = JSON.parse(localStorage.getItem('immersion_logs')) || [];

    function render() {
      const logList = document.getElementById('logList');
      let totalMins = 0;
      let totalCards = 0;

      logList.innerHTML = '';
      logs.forEach((log, index) => {
        totalMins += Number(log.minutes) || 0;
        totalCards += Number(log.cards) || 0;

        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <div>
            <strong>${log.note}</strong> <span style="font-size:0.8rem; color:#38bdf8;">(${log.minutes}m)</span>
            <div class="log-meta">${log.type} • ${log.cards > 0 ? '+' + log.cards + ' kata • ' : ''}${log.date}</div>
          </div>
          <button class="del-btn" onclick="removeLog(${index})">Hapus</button>
        `;
        logList.appendChild(div);
      });

      const hours = (totalMins / 60).toFixed(1);
      document.getElementById('totalTime').innerText = `${hours} Jam`;
      document.getElementById('totalCards').innerText = totalCards;
      localStorage.setItem('immersion_logs', JSON.stringify(logs));
    }

    document.getElementById('logForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newLog = {
        type: document.getElementById('type').value,
        minutes: document.getElementById('minutes').value,
        cards: document.getElementById('cards').value || 0,
        note: document.getElementById('note').value,
        date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })
      };
      logs.unshift(newLog);
      render();
      e.target.reset();
    });

    function removeLog(index) {
      logs.splice(index, 1);
      render();
    }

    render();
  </script>
</body>
</html>
